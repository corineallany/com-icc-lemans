name: Patch program participation UI
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify participation panel wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/routes/_authenticated/programme.$id.tsx')
          s=p.read_text()
          required=[
            'import { ProgramParticipationPanel } from "@/components/programs/ProgramParticipationPanel";',
            '<ProgramParticipationPanel',
          ]
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit(f'Missing participation wiring: {missing}')
          print('Program participation panel is wired correctly.')
          PY
