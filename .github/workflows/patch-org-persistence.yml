name: Patch organization persistence
on:
  push:
    paths:
      - '.github/workflows/patch-org-persistence.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch organization save
        shell: python
        run: |
          from pathlib import Path
          import re, base64
          p=Path('src/routes/_authenticated/parametres.tsx')
          s=p.read_text()
          pattern=r'''  const saveOrg = useMutation\(\{.*?\n  if \(!canEdit\)'''
          replacement=base64.b64decode('').decode()
          ns,n=re.subn(pattern,replacement,s,flags=re.S)
          if n!=1:
            raise SystemExit(f'Expected one saveOrg block, found {n}')
          p.write_text(ns)
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated/parametres.tsx
          git commit -m "fix: persist and verify organization referents" || exit 0
          git push
