name: One-shot rename demandes ponctuelles
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-rename-demandes-ponctuelles.yml'
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rename user-facing wording only
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # IMPORTANT: technical identifiers/routes/tables stay named "sollicitation" internally.
          # Only exact user-facing text is renamed.
          safe_global = {
              '"Sollicitations ponctuelles"': '"Demandes ponctuelles"',
              '"Sollicitations"': '"Demandes ponctuelles"',
              '>Sollicitations<': '>Demandes ponctuelles<',
              '>Sollicitations ponctuelles<': '>Demandes ponctuelles<',
          }
          file_specific = {
              'src/routes/_authenticated/sollicitations.tsx': {
                  'Nouvelle sollicitation ponctuelle': 'Nouvelle demande ponctuelle',
                  '+ Nouvelle sollicitation': '+ Nouvelle demande',
                  'Aucune sollicitation': 'Aucune demande ponctuelle',
                  'Modifier la sollicitation': 'Modifier la demande ponctuelle',
                  'Nouvelle sollicitation': 'Nouvelle demande ponctuelle',
                  'Réponse à une sollicitation': 'Réponse à une demande ponctuelle',
                  'Sollicitation modifiée': 'Demande ponctuelle modifiée',
                  'Sollicitation créée et envoyée': 'Demande ponctuelle créée et envoyée',
                  'Sollicitation annulée': 'Demande ponctuelle annulée',
                  'La sollicitation peut attribuer des créneaux précis ou laisser chaque membre': 'La demande ponctuelle peut attribuer des créneaux précis ou laisser chaque membre',
                  'personne(s) sollicitée(s)': 'personne(s) destinataire(s)',
                  '?? "Sollicitation"': '?? "Demande ponctuelle"',
              },
              'src/routes/_authenticated/pole.$id.tsx': {
                  'Aucune sollicitation en cours pour ce pôle.': 'Aucune demande ponctuelle en cours pour ce pôle.',
              },
              'src/lib/icc.ts': {
                  'Nouvelle sollicitation ponctuelle': 'Nouvelle demande ponctuelle',
                  'Sollicitation ponctuelle modifiée ou annulée': 'Demande ponctuelle modifiée ou annulée',
                  'Je suis retenu(e) après une sollicitation': 'Je suis retenu(e) après une demande ponctuelle',
                  'Réponse reçue à une sollicitation que je pilote': 'Réponse reçue à une demande ponctuelle que je pilote',
                  'Rappel avant échéance d’une sollicitation': 'Rappel avant échéance d’une demande ponctuelle',
              },
          }

          for p in Path('src').rglob('*'):
              if p.suffix not in {'.ts', '.tsx'}:
                  continue
              s = p.read_text()
              old = s
              for a,b in safe_global.items():
                  s = s.replace(a,b)
              for a,b in file_specific.get(p.as_posix(), {}).items():
                  s = s.replace(a,b)
              if s != old:
                  p.write_text(s)
                  print('updated', p)
          PY
      - name: Verify module wording
        run: |
          ! grep -nE 'Sollicitations ponctuelles|Nouvelle sollicitation ponctuelle|Aucune sollicitation|Modifier la sollicitation|Sollicitation (modifiée|créée et envoyée|annulée)|Réponse à une sollicitation|personne\(s\) sollicitée\(s\)' src/routes/_authenticated/sollicitations.tsx
          ! grep -n 'Aucune sollicitation en cours pour ce pôle.' 'src/routes/_authenticated/pole.$id.tsx'
          ! grep -nE 'Nouvelle sollicitation ponctuelle|Sollicitation ponctuelle modifiée ou annulée|après une sollicitation|à une sollicitation que je pilote|d’une sollicitation' src/lib/icc.ts
          grep -n 'function Sollicitations' src/routes/_authenticated/sollicitations.tsx
      - name: Build
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit rename and remove temporary workflow
        run: |
          rm .github/workflows/one-shot-rename-demandes-ponctuelles.yml
          git config user.name "corineallany"
          git config user.email "corineallany@gmail.com"
          git add src .github/workflows/one-shot-rename-demandes-ponctuelles.yml
          git commit -m "ux: rename ponctual solicitations as demandes ponctuelles"
          git push
